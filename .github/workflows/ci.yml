name: TestAutomationShowcase CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch: {}

permissions:
  contents: write
  
jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Install Playwright browsers
        run: |
          pwsh TestAutomationShowcase.Tests/bin/Release/net8.0/playwright.ps1 \
            install chromium --with-deps

      - name: Run NUnit tests
        env:
          ApiBaseUrl: ${{ vars.API_BASE_URL }}
          UiBaseUrl: ${{ vars.UI_BASE_URL }}
          SauceDemoCredentialsStandard__Username: ${{ secrets.SAUCE_STANDARD_USERNAME }}
          SauceDemoCredentialsStandard__Password: ${{ secrets.SAUCE_PASSWORD }}
          SauceDemoCredentialsLocked__Username: ${{ secrets.SAUCE_LOCKED_USERNAME }}
          SauceDemoCredentialsLocked__Password: ${{ secrets.SAUCE_PASSWORD }}
          RestfulBookerCredentials__Username: ${{ secrets.BOOKER_USERNAME }}
          RestfulBookerCredentials__Password: ${{ secrets.BOOKER_PASSWORD }}
        run: |
          dotnet test TestAutomationShowcase.Tests \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=nunit-results.trx" \
            --results-directory TestResults

      - name: Run Reqnroll tests
        if: always()
        env:
          ApiBaseUrl: ${{ vars.API_BASE_URL }}
          UiBaseUrl: ${{ vars.UI_BASE_URL }}
          SauceDemoCredentialsStandard__Username: ${{ secrets.SAUCE_STANDARD_USERNAME }}
          SauceDemoCredentialsStandard__Password: ${{ secrets.SAUCE_PASSWORD }}
          SauceDemoCredentialsLocked__Username: ${{ secrets.SAUCE_LOCKED_USERNAME }}
          SauceDemoCredentialsLocked__Password: ${{ secrets.SAUCE_PASSWORD }}
          RestfulBookerCredentials__Username: ${{ secrets.BOOKER_USERNAME }}
          RestfulBookerCredentials__Password: ${{ secrets.BOOKER_PASSWORD }}
        run: |
          dotnet test TestAutomationShowcase.GherkinTests \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=reqnroll-results.trx" \
            --results-directory TestResults
      
      - name: Collect Allure results
        if: always()
        run: |
          mkdir -p allure-results
          find . -path '*/bin/*/allure-results' -type d -exec sh -c 'cp -r "$1"/. allure-results/' _ {} \;
      
      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      
      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: allure-results
          allure_report: allure-report
          keep_reports: 10
          gh_pages: gh-pages
          allure_history: allure-history

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 14

      - name: Upload TRX results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-results
          path: TestResults/
          retention-days: 14

      - name: Publish test summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: TestResults/*.trx
          reporter: dotnet-trx
          fail-on-error: false
      
      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
